name: AncsBridge
options:
  bundleIdPrefix: com.wearos
  deploymentTarget:
    iOS: "26.0"

targets:
  AncsBridge:
    type: application
    platform: iOS
    sources:
      - AncsBridge
    capabilities:
      healthkit: true
    info:
      path: AncsBridge/Info-Generated.plist
      properties:
        CFBundleDisplayName: "WearBridge"
        LSRequiresIPhoneOS: true
        NSBluetoothAlwaysUsageDescription: "WearBridge needs Bluetooth to connect to your watch and forward notifications."
        NSBluetoothPeripheralUsageDescription: "WearBridge needs Bluetooth to be discoverable by your watch."
        NSHealthShareUsageDescription: "WearBridge writes your watch's heart rate, steps, sleep and workout data into Apple Health."
        NSHealthUpdateUsageDescription: "WearBridge writes your watch's heart rate, steps, sleep and workout data into Apple Health."
        UIBackgroundModes:
          - bluetooth-peripheral
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wearos.ancsbridge.companion
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: AncsBridge/AncsBridge.entitlements
        # Set your own Apple Developer team (Personal Team works); or delete and
        # pass DEVELOPMENT_TEAM via xcodebuild. Regenerate with: xcodegen generate
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGN_STYLE: Automatic

  AncsBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AncsBridgeTests
    settings:
      base:
        # Xcode 27 requires an Info.plist for the test bundle's code signing
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AncsBridge
