name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  wearos:
    name: Watch app — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Run tests
        working-directory: apps/wearos
        run: ./gradlew test --console=plain

  ios:
    name: iOS app — build (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Build
        working-directory: apps/ios
        run: xcodebuild -project AncsBridge.xcodeproj -scheme AncsBridge -destination "generic/platform=iOS" -configuration Debug CODE_SIGNING_ALLOWED=NO build | tail -20 && exit ${PIPESTATUS[0]}
